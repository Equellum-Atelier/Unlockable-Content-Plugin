name: Create Release

on: 
    workflow_dispatch:
        inputs:
            version:
                description: Release version
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
    
            - name: Create Archive
              run: |
                zip -r unlockable-content-v${{ github.event.inputs.version }}.zip addons
            
            - name: Create tag
              run: |
                git tag v${{ github.event.inputs.version }}
                git push origin v${{ github.event.inputs.version }}
            
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                tag_name: v${{ github.event.inputs.version }}
                generate_release_notes: true
                files: unlockable-content-v${{ github.event.inputs.version }}.zip